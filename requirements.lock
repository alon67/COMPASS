# COMPASS exact environment lock — the versions every published number was
# produced under.
#
# `pyproject.toml` declares LOWER BOUNDS, which is right for a library and wrong
# for a scientific archive: reinstalling from it a year from now can select a
# materially different NEURON, eFEL, SciPy or statsmodels, and none of the
# results in docs/RESULTS.md are claimed to be invariant to that (2026-08-09
# post-response-3 audit, P1-4).
#
# Install exactly this set:
#     python -m pip install --require-hashes=false -r requirements.lock
#
# Provenance of the pin: `python -m pip freeze`-equivalent capture from the
# interpreter that produced the release, recorded together with the interpreter
# and platform below. `results/validation/release_manifest.json:environment`
# records the same versions at build time, and the release verification fails if
# the running environment does not match this file
# (`tools/check_environment_lock.py`).
