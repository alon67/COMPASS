[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compass"
version = "0.1.0"
description = "COMPASS - Comparative Modeling of Parameter-Space Synergy and Sampling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "COMPASS project" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "SALib>=1.4",
    "efel>=5.5",
    "NEURON>=8.2",
    "PyYAML>=6.0",
    "joblib>=1.3",
    "tqdm>=4.66",
    "h5py>=3.10",
    "certifi",
]

[project.scripts]
compass = "compass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: longer integration runs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
# UP042 would rewrite `class X(str, Enum)` as `enum.StrEnum`. These enums are
# serialised into parquet/JSON manifests where `.value` is written explicitly;
# StrEnum changes what `str(x)` and f-string interpolation produce, so the
# rewrite is a silent format change to already-written result tables.
ignore = ["E501", "UP042"]
